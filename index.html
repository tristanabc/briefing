<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Briefing">
  <title>Morning Briefing</title>
  <style>
    :root { color-scheme: light }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
    .hdr { background: #1a1a2e; padding: 22px 24px 18px; }
    .hdr-label { font-size: 11px; color: #8888aa; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 4px; }
    .hdr-title { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.3px; margin-bottom: 4px; }
    .hdr-sub { font-size: 13px; color: #8888aa; }
    .section { padding: 18px 16px 4px; }
    .section-title { font-size: 10px; font-weight: 700; color: #888; letter-spacing: 1.4px; text-transform: uppercase; border-bottom: 2px solid #e4e4de; padding-bottom: 8px; margin-bottom: 12px; }
    .story { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .story-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
    .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
    .badge-afcb { background: #cc0000; color: #fff; }
    .badge-ft { background: #f0f0ea; color: #888; border: 1px solid #ddd; }
    .source { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.3px; }
    .story a { display: block; font-size: 15px; font-weight: 600; color: #1a1a2e; text-decoration: none; line-height: 1.42; margin-bottom: 5px; }
    .story p { font-size: 13px; color: #555; line-height: 1.55; }
    .feedback { margin: 16px 16px 4px; background: #eeeee8; border-radius: 10px; padding: 14px 16px; font-size: 13px; color: #666; line-height: 1.55; }
    .footer { padding: 14px 16px 20px; text-align: center; font-size: 11px; color: #bbb; }
    .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 32px; text-align: center; gap: 12px; }
    .placeholder-icon { font-size: 48px; }
    .placeholder h2 { font-size: 18px; font-weight: 600; color: #333; }
    .placeholder p { font-size: 14px; color: #888; line-height: 1.5; }
  </style>
</head>
<body>
<div class="hdr">
  <div class="hdr-label">Morning Briefing</div>
  <div class="hdr-title">Good morning, Tristan</div>
  <div class="hdr-sub">Your 6:45am briefing will appear here</div>
</div>
<div class="placeholder">
  <div class="placeholder-icon">&#x2600;&#xFE0F;</div>
  <h2>First briefing not yet delivered</h2>
  <p>The scheduled task runs every morning at 6:45am and will populate this page with today&#39;s news summary across all five sections.</p>
</div>
</body>
</html>
